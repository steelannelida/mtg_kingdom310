    When there are three journey counters on <this>, sacrifice it. Search your library for a creature card, reveal it, put it into your hand, then shuffle.
  flavor_text: "She ran past the apple tree, past the oven, past the river — and found him at last."
  notes: "Green rare Quest. Gusi-Lebedi flavor — the sister's rescue journey. Three safe attacks = creature tutor. High reward, needs setup."
  rarity: rare
  color: green
  art_style: 10
  art_file: spasti_bratsa.png
  art_prompt: "A young girl runs across an open Russian steppe at golden hour, her red shawl streaming behind her. Behind her: an apple tree, a clay oven, a wide river — each passed and left behind. Ahead,\
