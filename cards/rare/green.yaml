- name: Baba Yaga
  cost: "{2}{B}{G}"
  type_line: Legendary Creature — Human Warlock
  power: 3
  toughness: 5
  text: |-
    When <this> enters the battlefield, choose one:
    — Search your library for a Quest card, reveal it, put it into your hand, then shuffle.
    — Destroy target creature with power 2 or less.
    — Create three Food tokens.
    Whenever a creature you control completes a Quest, you may have that creature fight target creature an opponent controls.
  flavor_text: "I smell Russian spirit! Have you come of your own will, or were you sent?"
  notes: "Helper, tester, devourer. Three modes on entry. BG identity."
  rarity: rare
  color: green
  color_identity:
  - black
  - green
  art_style: 5
  art_file: baba_yaga.png
  art_prompt: "An ancient crone stands at the threshold of her bone-fenced hut deep in a birch forest, lit by a single lantern that bleeds amber into thick fog. Her iron mortar looms behind her. Three roads\
    \ diverge at her feet. Her eyes hold neither malice nor mercy — only the weight of every traveler who has ever come seeking answers, and every one who did not return."
  name_ru: Баба Яга
  name_en: Baba Yaga
- name: "Leshiy, Khozyain Lesa"
