- name: Iskupatsa v Kipyatke
  cost: "{1}{W}"
  type_line: Enchantment — Aura Quest
  text: |-
    Enchant creature you control (it is on a quest)
    When <this> comes into play, it deals 3 damage to enchanted creature.
    At the beginning of the next end step, sacrifice <this>. Put three +1/+1 counters on enchanted creature. It gains first strike for as long as you control it.
  flavor_text: The Tsar leapt in and was boiled alive. Ivan leapt in and came out a hero.
  notes: "White rare Quest. Konek-Gorbunok's boiling cauldron. Survive 3 damage on upkeep, then permanent +3/+3 and first strike. Huge payoff, needs a tough creature or protection."
  rarity: rare
  color: white
  art_style: 12
  art_file: iskupatsa_v_kipyatke_bathe_in_boiling_water.png
  art_prompt: "A young man plunges into an enormous iron cauldron of violently boiling water, steam billowing into near-black air, a single raking torch from above cutting a blade of warm light across his\
    \ arched back and the churning surface. The surrounding court watches from deep shadow — faces barely visible, expressions unreadable. The composition is all contrast: blazing white foam against darkness,\
    \ agony indistinguishable from ecstasy."
  name_ru: Искупаться в Кипятке
  name_en: Bathe in Boiling Water
