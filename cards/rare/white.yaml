- name: Ilya Muromets
  cost: "{3}{W}{W}"
  type_line: Legendary Creature — Human Soldier
  power: 4
  toughness: 6
  text: |-
    Vigilance; Indestructible as long as <this> is on a quest.
    Whenever <this> completes a Quest, exile target creature an opponent controls.
    When <this> enters the battlefield, you may search your library for a Quest card, reveal it, put it into your hand, then shuffle.
  flavor_text: "Thirty-three years on the stove. Then the kaliki came, and Russia had a champion."
