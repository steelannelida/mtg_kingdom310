- name: Smert Koscheyeva
  cost: "{3}{B}"
  type_line: Enchantment — Aura Quest
  text: |-
    Enchant creature you don't control (it is on a quest)
    Enchanted creature has: ""At the beginning of your upkeep, sacrifice an artifact or a creature, then put a lock counter on <this>."
    Whenever there are three lock counters on <this>, sacrifice it. Enchanted creature's owner can choose a creature. If they do, destroy that creature.
  flavor_text: "Break the needle. That is all you must do. But first — the egg, the duck, the hare, the chest, the oak."
  notes: "Black rare Quest. The Koschei death-chain. Three upkeep sacrifices (chest, hare, duck...), then exile-destroy any creature. Devastating payoff, real cost."
  rarity: rare
  color: black
  art_style: 12
  art_file: smert_koscheyeva_koschei_s_death.png
  art_prompt: "A sequence of nested objects rendered in a single dramatic still life: a gnarled oak chest in deep shadow, a duck's egg cracked open to reveal a smaller egg inside, and at the center, a long\
    \ iron needle lit by a single fierce beam of light from the upper left. The background is near-black. The needle glints. Everything converges on it. The composition reads as both treasure and doom."
  name_ru: Смерть Кощеева
  name_en: "Koschei's Death"
