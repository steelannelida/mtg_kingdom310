  color: black
  art_style: 12
  art_file: chernaya_kniga_black_book.png
  art_prompt: "A thick, iron-clasped tome lies open on a stone surface, its yellowed pages covered in dense script that seems to writhe in the torchlight. A single hand with ink-stained fingers presses\
