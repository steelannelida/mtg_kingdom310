- name: Ne Tushy Kostyor
  cost: "{R}"
  type_line: Enchantment - Nakaz
  text: |-
    Flash
    When <this> comes into battlefield, it deals 5 damage to target creature.
    At the end of your turn, if you haven't played a red spell this turn, Ne Tushyi Kostyor deals 3 damage to you. Sacrifice <this>.
  flavor_text: "Feed the flame, or the flame feeds on you."
  notes: 5 damage for R — absurdly efficient. Nakaz means your next big creature death burns you too.
  rarity: rare
  color: red
  art_style: 10
  art_file: nakaz_ne_tushyi_kostyor_don_t_extinguish_the_fire.png
  art_prompt: "A warrior stands before a towering campfire on an open steppe at night, arms spread wide as if embracing or commanding the blaze. The fire fills the upper half of the frame, dwarfing the\
