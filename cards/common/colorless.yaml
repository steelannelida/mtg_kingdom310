    When you control five or more Food tokens, sacrifice <this> and each Food you control. Each player gains 7 life.
  flavor_text: "'Cook, little pot, cook!' But no one remembered the words to make it stop."
  notes: "The fairy-tale pot that won't stop cooking! Free Food that eventually overflows."
  rarity: common
  color: colorless
  art_style: 1
  art_file: gorshochek_kashi_porridge_pot.png
  art_prompt: "a small clay pot on a table overflowing with thick porridge, the porridge spilling over the rim and flowing across the table onto the floor, more porridge still bubbling up endlessly"
  forge:
    T:
      - "Mode$ Phase | Phase$ Upkeep | ValidPlayer$ You | TriggerZones$ Battlefield | Execute$ TrigToken | TriggerDescription$ At the beginning of your upkeep, create a Food token."
      - "Mode$ Always | IsPresent$ Food.YouCtrl | PresentCompare$ GE5 | TriggerZones$ Battlefield | Execute$ TrigSac | TriggerDescription$ When you control five or more Food, sacrifice CARDNAME and each Food you control. Each player gains 7 life."
    SVar:
      TrigToken: "DB$ Token | TokenScript$ c_a_food_sac | TokenOwner$ You"
      TrigSac: "DB$ Sacrifice | Defined$ Self | SubAbility$ DBSacFood"
      DBSacFood: "DB$ SacrificeAll | ValidCards$ Food.YouCtrl | SubAbility$ DBGain"
      DBGain: "DB$ GainLife | Defined$ Player | LifeAmount$ 7"
  name_ru: Горшочек Каши
  name_en: Porridge Pot
