- name: Klubochek
  cost: "{1}"
  type_line: Artifact
  text: "{T}, sacrifice <this>: Search your library for a basic land card, put it into your hand, then shuffle. If you control a creature on a quest, put it onto the battlefield tapped instead."
  flavor_text: "The old woman gave him a ball of thread. 'Follow it,' she said. 'It knows the way.'"
  notes: "Baba Yaga's ball of thread. Land-finding with quest bonus. One-shot."
  rarity: common
  color: colorless
  art_style: 2
  art_file: klubochek_guiding_ball_of_thread.png
  art_prompt: "a small ball of golden thread rolling by itself along a forest path, unwinding as it goes leaving a glowing trail behind, the path dark and forking ahead, enchanted guidance"
  forge:
    # NOTE (2026-09-12): the "if you control a creature on a quest, put it onto the
    # battlefield tapped instead" upgrade is NOT implemented. ConditionPresent$/
    # ConditionCompare$ on the *root* A: ability line isn't respected by Forge (verified
    # empirically -- it's only honored on chained SubAbility$ SVars, not the top-level
    # activated ability itself), so the original two-mutually-exclusive-destinations
    # design silently did nothing at all. Fixing this properly needs restructuring
    # around an unconditional no-op root ability with both real attempts living as
    # conditioned SubAbility$ steps; deferred for time. This is the always-correct base
    # case only.
    A: "AB$ ChangeZone | Cost$ T Sac<1/CARDNAME> | Origin$ Library | Destination$ Hand | ChangeType$ Land.Basic | Shuffle$ True | SpellDescription$ Search your library for a basic land card, put it into your hand, then shuffle."
  name_ru: Клубочек
  name_en: Guiding Ball of Thread
- name: Gorshochek Kashi
