- name: Naydi Tsvetok Paporotnika
  cost: "{2}{G}"
  type_line: Enchantment — Aura Quest
  text: |-
    Enchant creature you control (it is on a quest)
    Enchanted creature gets +2/+2.
    At the beginning of each end step, if enchanted creature didn't attack or block this turn, put a bloom counter on <this>. When there are three bloom counters, sacrifice it and search your library for any card, put it into your hand, then shuffle.
  flavor_text: "The fern blooms once a year, on the shortest night, and only for those who sit perfectly still."
  notes: "The fern flower quest — a quest of PATIENCE. Don't attack or block for three turns, then tutor."
  rarity: uncommon
  color: green
  art_style: 5
  art_file: naydi_tsvetok_paporotnika_find_the_fern_flower.png
  art_prompt: "Deep in a summer midnight forest a lone figure sits cross-legged and motionless before a fern that is beginning, impossibly, to glow. A single blossom — warm amber, petal-edged in white —\
    \ unfurls in the darkness. The surrounding fronds dissolve into layered shadow and fog. No wind moves. Every other detail blurs at the edges; only the flower and the still figure are sharp."
  name_ru: Найди Цветок Папоротника
  name_en: Find the Fern Flower
