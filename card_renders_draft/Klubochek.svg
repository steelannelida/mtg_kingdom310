<use href="#mana-T" x="39.0" y="448.5" width="14" height="14"/><text x="55.1" y="460.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">, sacrifice Klubochek: Search your library</text><text x="37.0" y="480.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">for a basic land card, put it into your</text><text x="37.0" y="500.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">hand, then shuffle. If you control a</text><text x="37.0" y="520.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">creature on a quest, put it onto the</text><text x="37.0" y="540.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">battlefield tapped instead.</text><text x="37.0" y="580.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="font-style:italic;fill:#3a3a3a;">"The old woman gave him a ball of thread.</text><text x="37.0" y="600.0" font-family="'MPlantin', 'Georgia', serif" font-size="17" style="fill:#141414;">'Follow it,' she said. 'It knows the way.'"</text>
